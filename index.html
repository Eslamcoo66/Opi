<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>بطولة الغراقة الرمضانية</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f0f2f5;padding:20px;direction:rtl;}
h1{text-align:center;margin-bottom:20px;}
.group{padding:15px;margin-bottom:25px;border-radius:12px;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,0.15);}
.group.A{background:linear-gradient(45deg,#4a90e2,#357abd);}
.group.B{background:linear-gradient(45deg,#27ae60,#1e8449);}
.group.E{background:linear-gradient(45deg,#f39c12,#d68910);}
.group.F{background:linear-gradient(45deg,#c0392b,#922b21);}
table{width:100%;border-collapse:collapse;margin-top:10px;background:#fff;color:#000;border-radius:8px;overflow:hidden;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
th:first-child,td:first-child{text-align:center;font-weight:bold;}
.leader{background:#fff3b0 !important;font-weight:bold;}
th{background:#ececec;}
tr:hover{background:#eaf2ff;}
button{padding:6px 12px;margin:3px;cursor:pointer;border-radius:6px;border:none;background:#333;color:#fff;}
input,select{padding:4px;}
.lastUpdate{font-weight:bold;margin-bottom:6px;color:#fff;}
</style>
</head>

<body>

<h1>🏆 بطولة الغراقة الرمضانية</h1>

<div id="masterPanel" style="display:none"></div>
<div id="audience"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, push, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"YOUR_KEY",
authDomain:"gharaqa-ramadan.firebaseapp.com",
databaseURL:"https://gharaqa-ramadan-default-rtdb.firebaseio.com",
projectId:"gharaqa-ramadan"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const MASTER_PASSWORD="7890";

const groups={
A:["أصدقاء عبدالوهاب","شباب الشوكة","محلة كيل","أصدقاء حوش عيسي","شباب كوم البوص","الغراقة الغربية"],
B:["الشوكة الحاجر","الريف المصري","الصوالحية","اصدقاء محمد فؤاد","الزمالكاوية","البرنوجي"],
E:["ممتاز","كوم البوص","نجع العزايم","شباب العساكرة","أنصاف","أصدقاء اسامه الجارحي"],
F:["نجوم بطورس","الديابة","كوم القناطر","فلسطين","الحريفة","الغراقة الشرقية"]
};

const teamAlias={
"شباب العساكرة":"عزبة الست",
"فلسطين":"المحطة"
};

let isMaster=false;
if(location.search.includes("master")){
  const pw=prompt("ادخل كلمة سر الماستر");
  if(pw===MASTER_PASSWORD){
    isMaster=true;
    document.getElementById("masterPanel").style.display="block";
  }
}

const masterDiv=document.getElementById("masterPanel");
const audienceDiv=document.getElementById("audience");

// ===================== تغيير اسم الفريق مع تحديث المباريات =====================
window.renameTeam = async function(g){
  const sel = document.getElementById(`rename-${g}`);
  const newName = document.getElementById(`newname-${g}`).value.trim();
  if(!newName) return alert("اكتب الاسم الجديد");

  const oldName = sel.value;
  if(newName === oldName) return;

  // جلب جميع المباريات
  const snap = await get(ref(db, "matches/"+g));
  const data = snap.val() || {};

  // تحديث المباريات الحالية قبل تغيير الاسم
  const updates = {};
  for(const k in data){
    const m = data[k];
    let changed = false;
    if(m.t1 === oldName){ m.t1 = newName; changed = true; }
    if(m.t2 === oldName){ m.t2 = newName; changed = true; }
    if(changed) updates[k] = m;
  }

  // دفعة تحديث Firebase
  if(Object.keys(updates).length > 0) set(ref(db,"matches/"+g), {...data, ...updates});

  // تحديث alias و groups
  teamAlias[newName] = teamAlias[oldName] || oldName;
  groups[g] = groups[g].map(t => t===oldName ? newName : t);

  init();
}

// ===================== حذف الفريق بالكامل =====================
window.deleteTeam = async function(g){
  const sel = document.getElementById(`rename-${g}`);
  const delName = sel.value;
  if(!delName) return alert("اختر الفريق للحذف");
  if(!confirm(`هل أنت متأكد من حذف الفريق "${delName}"؟`)) return;

  groups[g] = groups[g].filter(t => t!==delName);
  delete teamAlias[delName];

  // حذف كل المباريات التي تحتوي الفريق
  const snap = await get(ref(db,"matches/"+g));
  const data = snap.val() || {};
  for(const k in data){
    const m = data[k];
    if(m.t1===delName || m.t2===delName){
      set(ref(db,"matches/"+g+"/"+k), null);
    }
  }

  init();
}

// ===================== إضافة مباراة =====================
window.addMatch=function(g){
  const t1=document.getElementById(`t1-${g}`).value;
  const t2=document.getElementById(`t2-${g}`).value;
  const s1=parseInt(document.getElementById(`s1-${g}`).value)||0;
  const s2=parseInt(document.getElementById(`s2-${g}`).value)||0;
  if(t1===t2) return alert("اختار فريقين مختلفين");
  push(ref(db,"matches/"+g),{t1,t2,s1,s2,time:Date.now()});
}

// ===================== تعديل / حذف مباراة =====================
window.editMatch=function(g,k){
  const s1=prompt("هدف الفريق الأول");
  const s2=prompt("هدف الفريق الثاني");
  if(s1===null||s2===null) return;
  set(ref(db,"matches/"+g+"/"+k+"/s1"),parseInt(s1)||0);
  set(ref(db,"matches/"+g+"/"+k+"/s2"),parseInt(s2)||0);
  set(ref(db,"matches/"+g+"/"+k+"/time"),Date.now());
}

window.delMatch=function(g,k){
  if(confirm("حذف؟")) set(ref(db,"matches/"+g+"/"+k), null);
}

// ===================== الاستماع للمباريات =====================
function listenGroup(g){
  onValue(ref(db,"matches/"+g), snap=>{
    const data = snap.val() || {};
    const teams = {};
    for(const t of groups[g]){
      const old = teamAlias[t] || t;
      teams[t] = {name:t, old, p:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0};
    }

    let last = 0;
    for(const k in data){
      const m = data[k];
      if(m.time > last) last = m.time;

      const a = Object.values(teams).find(x => x.old === m.t1);
      const b = Object.values(teams).find(x => x.old === m.t2);
      if(!a||!b) continue;

      a.p++; b.p++;
      a.gf += m.s1; a.ga += m.s2;
      b.gf += m.s2; b.ga += m.s1;

      if(m.s1 > m.s2){ a.w++; a.pts+=3; b.l++; }
      else if(m.s2 > m.s1){ b.w++; b.pts+=3; a.l++; }
      else{ a.d++; b.d++; a.pts++; b.pts++; }
    }

    for(const t in teams) teams[t].gd = teams[t].gf - teams[t].ga;

    const sorted = Object.values(teams).sort((a,b)=>{
      if(b.pts !== a.pts) return b.pts - a.pts;
      if(b.gd !== a.gd) return b.gd - a.gd;
      return b.gf - a.gf;
    });

    const audBody = document.querySelector(`#audTable-${g} tbody`);
    audBody.innerHTML="";
    const mastBody = isMaster ? document.querySelector(`#masterTable-${g} tbody`) : null;
    if(mastBody) mastBody.innerHTML="";

    sorted.forEach((d,i)=>{
      const row = `<td>${d.name}</td><td>${d.p}</td><td>${d.w}</td><td>${d.d}</td><td>${d.l}</td>
<td>${d.gf}</td><td>${d.ga}</td><td>${d.gd}</td><td>${d.pts}</td>`;
      const tr = document.createElement("tr");
      if(i===0) tr.classList.add("leader");
      tr.innerHTML = row;
      audBody.appendChild(tr);

      if(mastBody){
        const tr2 = document.createElement("tr");
        tr2.innerHTML = row;
        mastBody.appendChild(tr2);
      }
    });

    const audM = document.querySelector(`#audMatches-${g} tbody`);
    audM.innerHTML="";
    const mastM = isMaster ? document.querySelector(`#masterMatches-${g} tbody`) : null;
    if(mastM) mastM.innerHTML="";

    for(const k in data){
      const m = data[k];
      const name1 = Object.values(teams).find(x=>x.old===m.t1)?.name||m.t1;
      const name2 = Object.values(teams).find(x=>x.old===m.t2)?.name||m.t2;

      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${name1}</td><td>${m.s1}</td><td>${name2}</td><td>${m.s2}</td>`;
      audM.appendChild(tr);

      if(mastM){
        const tr2 = document.createElement("tr");
        tr2.innerHTML = `<td>${name1}</td><td>${m.s1}</td><td>${name2}</td><td>${m.s2}</td>
<td><button onclick="editMatch('${g}','${k}')">تعديل</button></td>
<td><button onclick="delMatch('${g}','${k}')">حذف</button></td>`;
        mastM.appendChild(tr2);
      }
    }

    if(last){
      const d = new Date(last);
      document.getElementById(`update-${g}`).textContent = "آخر تحديث "+d.toLocaleTimeString();
    }
  });
}

// ===================== إنشاء واجهات الماستر والجمهور =====================
function init(){
  masterDiv.innerHTML=""; audienceDiv.innerHTML="";
  for(const g in groups){
    if(isMaster){
      const box = document.createElement("div");
      box.className = "group "+g;
      box.innerHTML = `
<h2>المجموعة ${g} (تحكم)</h2>
<div style="margin-bottom:10px">
<select id="rename-${g}"></select>
<input id="newname-${g}" placeholder="الاسم الجديد">
<button onclick="renameTeam('${g}')">تغيير الاسم</button>
<button onclick="deleteTeam('${g}')">حذف الفريق</button>
</div>
<select id="t1-${g}"></select>
<input type="number" id="s1-${g}" value="0"> -
<input type="number" id="s2-${g}" value="0">
<select id="t2-${g}"></select>
<button onclick="addMatch('${g}')">إضافة</button>
<table id="masterTable-${g}">
<thead><tr><th>الفريق</th><th>لعب</th><th>فوز</th><th>تعادل</th><th>خسارة</th><th>+</th><th>-</th><th>فارق</th><th>نقاط</th></tr></thead>
<tbody></tbody></table>
<h4>المباريات</h4>
<table id="masterMatches-${g}">
<thead><tr><th>فريق</th><th>أهداف</th><th>فريق</th><th>أهداف</th><th>تعديل</th><th>حذف</th></tr></thead>
<tbody></tbody></table>
`;
      masterDiv.appendChild(box);

      for(const t of groups[g]){
        box.querySelector(`#t1-${g}`).add(new Option(t,t));
        box.querySelector(`#t2-${g}`).add(new Option(t,t));
        box.querySelector(`#rename-${g}`).add(new Option(t,t));
      }
    }

    const aud = document.createElement("div");
    aud.className = "group "+g;
    aud.innerHTML = `
<h2>المجموعة ${g}</h2>
<div class="lastUpdate" id="update-${g}">آخر تحديث -</div>
<table id="audTable-${g}">
<thead><tr><th>الفريق</th><th>لعب</th><th>فوز</th><th>تعادل</th><th>خسارة</th><th>+</th><th>-</th><th>فارق</th><th>نقاط</th></tr></thead>
<tbody></tbody></table>
<h4>النتائج</h4>
<table id="audMatches-${g}">
<thead><tr><th>فريق</th><th>أهداف</th><th>فريق</th><th>أهداف</th></tr></thead>
<tbody></tbody></table>
`;
    audienceDiv.appendChild(aud);
    listenGroup(g);
  }
}

init();
</script>

</body>
</html>
